name: Frontend Image Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-image-publish
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.FRONTEND_ECR_REPOSITORY }}

jobs:
  build-test-and-push:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image URI
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: echo "uri=${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: docker build --platform linux/amd64 --tag "${{ steps.image.outputs.uri }}" .

      - name: Push Docker image
        run: docker push "${{ steps.image.outputs.uri }}"

      - name: Write job summary
        run: |
          echo 'ECR image tag: `${{ github.sha }}`' >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy frontend to EC2
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          PARAMS=$(jq -cn \
            --arg tag "$GITHUB_SHA" \
            --arg region "$AWS_REGION" '{
              commands: [
                "set -e",
                "cd /opt/community/deploy",
                ("sed -i \"s/^FRONTEND_IMAGE_TAG=.*/FRONTEND_IMAGE_TAG=" + $tag + "/\" .env"),
                "REGISTRY=$(sed -n \"s/^ECR_REGISTRY=//p\" .env)",
                ("aws ecr get-login-password --region " + $region + " | docker login --username AWS --password-stdin \"$REGISTRY\""),
                "docker compose --env-file .env pull frontend",
                "docker compose --env-file .env up -d --no-deps frontend",
                "docker compose --env-file .env ps frontend"
              ]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$PARAMS" \
            --query 'Command.CommandId' \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"
